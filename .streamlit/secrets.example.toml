# 复制本文件为 .streamlit/secrets.toml 并填入真实信息。
# 严禁将真实 api_key 提交到版本控制。
# 配置优先级（默认）：UI 本场设置 > 环境变量 > st.secrets[defaults] > config.py DEFAULTS。
# 设置环境变量 AI_DEBATE_LOCK_CONFIG=true 后：环境变量 > UI 本场设置 > st.secrets[defaults] > config.py DEFAULTS。

[A]
base_url = "https://api.openai.com/v1"
api_key = "sk-..."
model = "gpt-4o-mini"
temperature = 0.7
timeout_s = 60
max_retries = 1
# extra_body = {}         # 厂商私有参数，如 GLM 的 thinking 开关；普通情况保持注释

[B]
base_url = "https://api.openai.com/v1"
api_key = "sk-..."
model = "gpt-4o-mini"
temperature = 0.7
timeout_s = 60
max_retries = 1
# extra_body = {}

[JUDGE_AI]
base_url = "https://api.openai.com/v1"
api_key = "sk-..."
model = "gpt-4o-mini"
temperature = 0.0
timeout_s = 60
max_retries = 1
# extra_body = {}

[defaults]
word_limit = 300                       # 每轮默认字数（讨论模式下更克制，省 token）
max_rounds = 6                         # 默认回合数
input_budget = 3500                    # 提示词默认 token 预算
output_max_tokens = 0                  # 0 = auto: clamp(round(word_limit * 2.2), 512, 2048)
                                       # 中文输出不建议写死 512，否则长辩题会被截断
final_token_ratio = 3.5                # 输出 token 相对字数比例
reasoning_budget = 2048                # 中盘每轮允许的 reasoning tokens
reasoning_budget_open_close = 4096     # 开篇/收尾允许的 reasoning tokens
final_token_floor = 1024               # 输出 token 下限
hard_cap = 8192                        # 输出 token 硬上限
finalizer_on_empty = true              # 空/脏稿是否启用 finalizer 二次定稿
keep_reasoning_private = true          # reasoning 不进入公共 transcript
reasoning_heuristic = true             # 是否启用启发式 dirty 检测
debug_raw_response = false             # 是否记录脱敏原始响应到 provider_debug.log
weight_judge = 0.6                     # 人类裁判评分权重
weight_ai = 0.4                        # JUDGE_AI 评分权重
strict_evidence = false                # 是否开启严格证据模式
mock_mode = true                       # true 时不调真实 API，用 MockProvider 跑通状态机
forfeit_policy = "skip"                # skip | forced_confirm（forced_confirm 当前等同 skip，不绕过裁判确认，仅为未来扩展占位）
overrun_mode = "penalty"               # truncate | penalty | reject
early_stop = true                       # 连续两轮无新内容时自动收敛，提前进入结论阶段
price_in_per_1m = 2.0                   # 输入价格（¥/百万 token，估算成本用）
price_out_per_1m = 8.0                  # 输出价格（¥/百万 token，估算成本用）
