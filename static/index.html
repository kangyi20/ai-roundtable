<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 讨论室</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🌸</span>
      <div>
        <div class="title">AI 讨论室</div>
        <div class="subtitle">两个 AI 就一个话题自然讨论，可被说服、最终汇总结论</div>
      </div>
    </div>
    <div class="metrics" id="metrics">
      <div class="metric"><span class="k">输入</span><span class="v" id="m_in">0</span></div>
      <div class="metric"><span class="k">输出</span><span class="v" id="m_out">0</span></div>
      <div class="metric"><span class="k">成本</span><span class="v" id="m_cost">¥0.0000</span></div>
      <div class="metric"><span class="k">轮次</span><span class="v" id="m_round">–</span></div>
    </div>
  </header>

  <main class="layout">
    <section class="chat-col">
      <div class="statusbar" id="statusbar"></div>
      <div class="stances" id="stances" hidden></div>
      <div class="conclusion" id="conclusion" hidden></div>
      <div class="conclusion" id="score" hidden></div>
      <div class="feed" id="feed">
        <div class="empty" id="empty">
          <div class="empty-icon">🌸</div>
          <div>在右侧配置话题，开始一场讨论</div>
        </div>
      </div>
    </section>

    <aside class="side-col">
      <div class="panel" id="loadPanel">
        <h3>历史讨论</h3>
        <label>加载已有讨论</label>
        <div class="loadbox">
          <select id="f_load"><option value="">— 选择历史记录 —</option></select>
          <div class="row">
            <button class="btn primary" id="btn_load">加载选中</button>
            <button class="btn" id="btn_new">🔄 新建讨论</button>
          </div>
        </div>
      </div>

      <div class="panel" id="startPanel">
        <h3>开始讨论</h3>
        <label>话题</label>
        <input id="f_topic" value="人工智能利大于弊还是弊大于利" />
        <label>A 方视角</label>
        <input id="f_pro" value="人工智能利大于弊" />
        <label>B 方视角</label>
        <input id="f_con" value="人工智能弊大于利" />

        <label>讨论长度</label>
        <select id="f_length">
          <option value="200">简洁（~200字）</option>
          <option value="300" selected>均衡（~300字）</option>
          <option value="400">深入（~400字）</option>
        </select>

        <label>讨论轮数（上限）</label>
        <input type="number" id="f_rounds" min="1" max="20" value="6" />

        <label class="switch-row">
          <input type="checkbox" id="f_early" checked /> 内容收敛自动结束
        </label>
        <label class="switch-row">
          <input type="checkbox" id="f_mock" /> Mock 模式（不调用真实 API）
        </label>

        <details class="advanced">
          <summary>⚙ 高级设置（token 预算 / 策略）</summary>
          <label>输入预算（tokens）</label>
          <input type="number" id="f_input_budget" min="100" step="100" />
          <label>输出 token 上限（0=自动）</label>
          <input type="number" id="f_output_max_tokens" min="0" step="100" />
          <label>中盘思考预算</label>
          <input type="number" id="f_reasoning_budget" min="0" step="100" />
          <label>开篇/收尾思考预算</label>
          <input type="number" id="f_reasoning_open_close" min="0" step="100" />
          <label>输出 token 硬上限</label>
          <input type="number" id="f_hard_cap" min="512" step="100" />
          <label class="switch-row">
            <input type="checkbox" id="f_strict" /> 严格证据
          </label>
          <label>超字处理</label>
          <select id="f_overrun">
            <option value="penalty">扣分</option>
            <option value="truncate">截断</option>
            <option value="reject">驳回</option>
          </select>
          <label>弃权策略</label>
          <select id="f_forfeit">
            <option value="skip">跳过</option>
            <option value="forced_confirm">强制确认占位</option>
          </select>
        </details>

        <div class="btn-row">
          <button class="btn primary" id="btn_start">开始讨论（手动）</button>
          <button class="btn accent" id="btn_autostart">自动讨论</button>
        </div>
      </div>

      <div class="panel" id="controlPanel" hidden>
        <h3>控制</h3>
        <div class="btn-row">
          <button class="btn accent" id="btn_auto_toggle">▶ 自动讨论</button>
        </div>
        <div id="manualControls" class="manual-list"></div>
        <div class="note-box">
          <input id="f_note" placeholder="主持人备注（可中途引导方向）" />
          <button class="btn" id="btn_note">插入备注</button>
        </div>
        <div id="exportLinks" class="export-links"></div>
      </div>

      <div class="panel" id="modelsPanel">
        <h3>模型</h3>
        <div id="models"></div>
      </div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
